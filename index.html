<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ultra-minimalist roommate mess bill manager" />
  <title>Mess Bill Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            abyss: '#000000',
            panel: '#121212',
            neon: '#00f2fe'
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(0, 242, 254, 0.75), 0 0 28px rgba(0, 242, 254, 0.16)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      background: #000000;
      color: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f1f1f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 bg-abyss text-white">
  <div class="mx-auto max-w-2xl">
    
    <!-- Header -->
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-white/10 pb-6">
      <div>
        <div class="text-[10px] uppercase tracking-[0.45em] text-white/40 font-semibold">Minimalist Dashboard</div>
        <h1 class="text-3xl font-extrabold text-white mt-1">Mess Billing</h1>
      </div>
      
      <!-- Week Selector Dropdown -->
      <div class="flex flex-col gap-1.5 min-w-[240px]">
        <label for="weekSelector" class="text-[9px] uppercase tracking-[0.25em] text-white/35 font-bold">Select Week</label>
        <select id="weekSelector" class="w-full rounded-2xl border border-white/10 bg-panel px-4 py-3.5 text-sm text-white outline-none focus:border-neon focus:ring-1 focus:ring-neon transition duration-200 cursor-pointer">
          <!-- Populated dynamically -->
        </select>
      </div>
    </header>

    <!-- Main Roommates List (Home Page) -->
    <main>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xs uppercase tracking-[0.3em] text-white/35 font-bold">Roommates Directory</h2>
        <span id="syncIndicator" class="text-[9px] uppercase tracking-[0.2em] text-white/45">Synced</span>
      </div>
      
      <div id="roommatesList" class="flex flex-col gap-4">
        <!-- Roommate cards will be rendered here dynamically -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 text-center text-[10px] uppercase tracking-[0.3em] text-white/20 border-t border-white/5 pt-6">
      Roommate Mess Manager &bull; Powered by Vercel KV
    </footer>
  </div>

  <script>
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const friends = ['Sangeeth', 'Devan', 'Sreesanth', 'Ashwin', 'Reno'];
    const mealDefinitions = [
      { key: 'breakfast', label: 'Breakfast', defaultPrice: 40 },
      { key: 'lunch', label: 'Lunch', defaultPrice: 60 },
      { key: 'dinner', label: 'Dinner', defaultPrice: 40 }
    ];

    const API_LOAD_URL = '/api/sync';
    const API_SAVE_URL = '/api/sync';

    let activeWeekStart = null;
    let cloudLogs = [];
    const expandedRoommates = new Set(); // Tracks currently expanded cards

    // Helper functions for date operations
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${date}`;
    }

    function getWeekRangeStr(mondayStr) {
      const start = new Date(mondayStr);
      const end = new Date(mondayStr);
      end.setDate(end.getDate() + 6);
      
      const options = { month: 'short', day: 'numeric' };
      const startLabel = start.toLocaleDateString('en-US', options);
      const endLabel = end.toLocaleDateString('en-US', { 
        month: start.getMonth() === end.getMonth() ? undefined : 'short', 
        day: 'numeric' 
      });
      const yearLabel = end.getFullYear();
      
      return `${startLabel} - ${endLabel}, ${yearLabel}`;
    }

    // Normalizes records returning from the API database
    function normalizeCloudRecord(record) {
      if (!record) return null;

      const day = record.day || record.Day || '';
      let date = record.date || record.Date || '';
      if (!date && day && activeWeekStart) {
        const idx = days.indexOf(day);
        if (idx !== -1) {
          const fallbackDate = new Date(activeWeekStart);
          fallbackDate.setDate(fallbackDate.getDate() + idx);
          date = formatDate(fallbackDate);
        }
      }
      const roommateName = record.roommateName || record.Roommate || record.roommate || '';
      const roommateNames = record.roommateNames || record.friends || (roommateName ? [roommateName] : []);
      const meals = record.meals || record.Meals || {};
      const prices = record.prices || record.Prices || {};
      const totalDailyRate = Number(record.totalDailyRate ?? record.TotalDailyRate ?? record.total ?? 0);
      const savedAt = record.savedAt || record.SavedAt || new Date().toISOString();

      return {
        day,
        date,
        roommateName,
        roommateNames,
        meals,
        prices,
        totalDailyRate,
        savedAt
      };
    }

    function normalizeCloudRecords(records) {
      return (records || []).map(normalizeCloudRecord).filter(Boolean);
    }

    function formatCurrency(value) {
      return `₹${Number(value || 0).toFixed(0)}`;
    }

    // Fetch logs from the API database
    async function fetchCloudLogs() {
      const syncIndicator = document.getElementById('syncIndicator');
      syncIndicator.textContent = 'Syncing...';
      syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-neon animate-pulse';

      try {
        const response = await fetch(API_LOAD_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error(`GET ${response.status}`);

        const data = await response.json();
        cloudLogs = normalizeCloudRecords(data);
        
        syncIndicator.textContent = 'Synced';
        syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-white/45';
        
        // Re-generate dropdown menu options to capture new weeks
        buildWeekSelectorOptions();
        renderRoommatesList();
      } catch (error) {
        console.error('Failed to load cloud logs:', error);
        syncIndicator.textContent = 'Sync Failed';
        syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-red-400';
      }
    }

    // Dynamic dropdown weeks list generator
    function buildWeekSelectorOptions() {
      const currentMonday = getMonday(new Date());
      const currentMondayStr = formatDate(currentMonday);
      
      const weeksSet = new Set();
      weeksSet.add(currentMondayStr);
      
      // Seed with last 8 weeks
      for (let i = 1; i <= 8; i++) {
        const d = new Date(currentMonday);
        d.setDate(d.getDate() - (i * 7));
        weeksSet.add(formatDate(d));
      }
      
      // Extract any historical weeks from saved logs
      cloudLogs.forEach(log => {
        if (log.date) {
          const logMonday = getMonday(log.date);
          weeksSet.add(formatDate(logMonday));
        }
      });
      
      const sortedWeeks = Array.from(weeksSet).sort().reverse();
      const select = document.getElementById('weekSelector');
      const previousValue = select.value || currentMondayStr;
      
      select.innerHTML = sortedWeeks.map(mondayStr => {
        const label = getWeekRangeStr(mondayStr);
        const suffix = (mondayStr === currentMondayStr) ? ' (Current Week)' : '';
        return `<option value="${mondayStr}">${label}${suffix}</option>`;
      }).join('');
      
      select.value = previousValue;
      activeWeekStart = new Date(select.value + 'T00:00:00');
    }

    // Main layout rendering: roommate directory and details logs
    function renderRoommatesList() {
      const roommatesList = document.getElementById('roommatesList');
      roommatesList.innerHTML = '';

      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);

      // Filter all logs for the currently selected week date range
      const activeWeekLogs = cloudLogs.filter(log => log.date >= startStr && log.date <= endStr);

      friends.forEach(friend => {
        // Calculate roommate totals and counters for the selected week
        const roommateLogs = activeWeekLogs.filter(log => log.roommateNames.includes(friend) || log.roommateName === friend);
        
        let totalCost = 0;
        let breakfastCount = 0;
        let lunchCount = 0;
        let dinnerCount = 0;

        roommateLogs.forEach(log => {
          const meals = log.meals || {};
          if (meals.breakfast && meals.breakfast.checked) {
            totalCost += Number(meals.breakfast.price || 0);
            breakfastCount++;
          }
          if (meals.lunch && meals.lunch.checked) {
            totalCost += Number(meals.lunch.price || 0);
            lunchCount++;
          }
          if (meals.dinner && meals.dinner.checked) {
            totalCost += Number(meals.dinner.price || 0);
            dinnerCount++;
          }
        });

        const expanded = expandedRoommates.has(friend);

        // Build roommate card element
        const card = document.createElement('div');
        card.className = `border rounded-3xl bg-panel p-6 transition duration-200 ${
          expanded ? 'border-neon/40 shadow-[0_0_16px_rgba(0,242,254,0.06)]' : 'border-white/10 hover:border-white/20'
        }`;

        // Header (Toggles expanded state)
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between cursor-pointer select-none';
        header.innerHTML = `
          <div>
            <h3 class="text-lg font-bold text-white">${friend}</h3>
            <p class="text-[9px] uppercase tracking-wider text-white/40 mt-0.5">Roommate Summary</p>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-xl font-extrabold text-neon">${formatCurrency(totalCost)}</span>
            <span class="text-white/40 text-xs transition-transform duration-200 transform ${expanded ? 'rotate-180' : ''}">▼</span>
          </div>
        `;
        header.addEventListener('click', () => {
          if (expandedRoommates.has(friend)) {
            expandedRoommates.delete(friend);
          } else {
            expandedRoommates.add(friend);
          }
          renderRoommatesList();
        });
        card.appendChild(header);

        // Expanded Body (Shows logs grids and counters)
        if (expanded) {
          const body = document.createElement('div');
          body.className = 'mt-6 border-t border-white/5 pt-6';
          
          // Counters UI
          let countersHtml = `
            <div class="grid grid-cols-3 gap-2.5 mb-6 text-center">
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Breakfasts</div>
                <div class="text-base font-bold text-neon mt-0.5">${breakfastCount}</div>
              </div>
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Lunches</div>
                <div class="text-base font-bold text-neon mt-0.5">${lunchCount}</div>
              </div>
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Dinners</div>
                <div class="text-base font-bold text-neon mt-0.5">${dinnerCount}</div>
              </div>
            </div>
          `;

          // Weekly logs list (Monday to Sunday checkable checkboxes)
          let daysHtml = days.map((dayName, idx) => {
            const d = new Date(activeWeekStart);
            d.setDate(d.getDate() + idx);
            const dateStr = formatDate(d);
            const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            // Find if there is an existing log for this roommate on this date
            const existingDayLog = roommateLogs.find(log => log.date === dateStr);
            
            const bChecked = existingDayLog?.meals?.breakfast?.checked || false;
            const bPrice = existingDayLog?.meals?.breakfast?.price ?? 40;
            
            const lChecked = existingDayLog?.meals?.lunch?.checked || false;
            const lPrice = existingDayLog?.meals?.lunch?.price ?? 60;
            
            const dChecked = existingDayLog?.meals?.dinner?.checked || false;
            const dPrice = existingDayLog?.meals?.dinner?.price ?? 40;

            return `
              <div class="flex flex-col gap-2 p-3 bg-black/25 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-1">
                  <span class="font-bold text-xs text-white/90">${dayName}</span>
                  <span class="text-[9px] uppercase tracking-wider text-white/40">${dateLabel}</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  
                  <!-- Breakfast -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-breakfast" ${bChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Breakfast</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-breakfast" value="${bPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                  <!-- Lunch -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-lunch" ${lChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Lunch</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-lunch" value="${lPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                  <!-- Dinner -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-dinner" ${dChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Dinner</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-dinner" value="${dPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                </div>
              </div>
            `;
          }).join('');

          body.innerHTML = `
            ${countersHtml}
            <div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-2">Logs Sheet</div>
            <div class="flex flex-col gap-3">
              ${daysHtml}
            </div>
            
            <div class="mt-6 flex flex-col gap-2">
              <button id="btn-save-${friend}" type="button" onclick="saveRoommateWeek('${friend}')" class="w-full rounded-2xl border border-neon bg-neon/15 px-4 py-3 text-xs font-bold text-neon shadow-[0_0_12px_rgba(0,242,254,0.02)] hover:bg-neon/25 transition duration-200">
                Save Logs for ${friend}
              </button>
              <div id="status-${friend}" class="text-[9px] uppercase tracking-wider text-center text-white/40 min-h-[14px] mt-1"></div>
            </div>
          `;
          card.appendChild(body);
        }

        roommatesList.appendChild(card);
      });
    }

    // Handles saving roommate's weekly logs compiled into JSON payload
    async function saveRoommateWeek(friend) {
      const statusLabel = document.getElementById(`status-${friend}`);
      const saveBtn = document.getElementById(`btn-save-${friend}`);
      
      statusLabel.textContent = 'Saving...';
      statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-neon animate-pulse mt-1';
      saveBtn.disabled = true;

      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);

      const newLogsForFriend = [];

      // Compile checkboxes and pricing inputs for all 7 days
      for (let idx = 0; idx < 7; idx++) {
        const d = new Date(activeWeekStart);
        d.setDate(d.getDate() + idx);
        const dateStr = formatDate(d);
        const dayName = days[idx];

        const chkBreakfast = document.getElementById(`chk-${friend}-${dateStr}-breakfast`).checked;
        const valBreakfast = Number(document.getElementById(`val-${friend}-${dateStr}-breakfast`).value || 40);

        const chkLunch = document.getElementById(`chk-${friend}-${dateStr}-lunch`).checked;
        const valLunch = Number(document.getElementById(`val-${friend}-${dateStr}-lunch`).value || 60);

        const chkDinner = document.getElementById(`chk-${friend}-${dateStr}-dinner`).checked;
        const valDinner = Number(document.getElementById(`val-${friend}-${dateStr}-dinner`).value || 40);

        if (chkBreakfast || chkLunch || chkDinner) {
          let dailyRate = 0;
          if (chkBreakfast) dailyRate += valBreakfast;
          if (chkLunch) dailyRate += valLunch;
          if (chkDinner) dailyRate += valDinner;

          newLogsForFriend.push({
            day: dayName,
            date: dateStr,
            roommateNames: [friend],
            roommateName: friend,
            meals: {
              breakfast: { checked: chkBreakfast, price: valBreakfast },
              lunch: { checked: chkLunch, price: valLunch },
              dinner: { checked: chkDinner, price: valDinner }
            },
            prices: {
              breakfast: valBreakfast,
              lunch: valLunch,
              dinner: valDinner
            },
            totalDailyRate: dailyRate,
            savedAt: new Date().toISOString()
          });
        }
      }

      // Filter out target roommate's logs inside selected week to avoid duplicates
      const otherLogs = cloudLogs.filter(log => {
        const isTargetFriend = log.roommateNames.includes(friend) || log.roommateName === friend;
        const isTargetWeek = log.date >= startStr && log.date <= endStr;
        return !(isTargetFriend && isTargetWeek);
      });

      const updatedLogs = [...otherLogs, ...newLogsForFriend];

      try {
        const response = await fetch(API_SAVE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updatedLogs)
        });

        if (!response.ok) throw new Error(`POST ${response.status}`);

        // Re-fetch database state to trigger UI updates
        await fetchCloudLogs();
        
        statusLabel.textContent = 'Saved Successfully!';
        statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-neon mt-1';
        setTimeout(() => {
          statusLabel.textContent = '';
        }, 3000);
      } catch (error) {
        console.error('Failed to save roommate week logs:', error);
        statusLabel.textContent = 'Save Failed';
        statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-red-400 mt-1';
      } finally {
        saveBtn.disabled = false;
      }
    }

    // Set dropdown change handler
    document.getElementById('weekSelector').addEventListener('change', (e) => {
      activeWeekStart = new Date(e.target.value + 'T00:00:00');
      renderRoommatesList();
    });

    // Initialize layout on window load
    window.addEventListener('load', () => {
      buildWeekSelectorOptions();
      fetchCloudLogs();
    });
  </script>
</body>
</html>
