<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ultra-minimalist roommate mess bill manager" />
  <title>Mess Bill Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            abyss: '#000000',
            panel: '#121212',
            neon: '#00f2fe'
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(0, 242, 254, 0.75), 0 0 28px rgba(0, 242, 254, 0.16)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      background: #000000;
      color: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f1f1f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 bg-abyss text-white">
  <div class="mx-auto max-w-2xl">
    
    <!-- Header -->
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-white/10 pb-6">
      <div>
        <div class="text-[10px] uppercase tracking-[0.45em] text-white/40 font-semibold">Minimalist Dashboard</div>
        <h1 class="text-3xl font-extrabold text-white mt-1">Mess Billing</h1>
      </div>
      
      <!-- Week Selector Dropdown -->
      <div class="flex flex-col gap-1.5 min-w-[240px]">
        <label for="weekSelector" class="text-[9px] uppercase tracking-[0.25em] text-white/35 font-bold">Select Week</label>
        <select id="weekSelector" class="w-full rounded-2xl border border-white/10 bg-panel px-4 py-3.5 text-sm text-white outline-none focus:border-neon focus:ring-1 focus:ring-neon transition duration-200 cursor-pointer">
          <!-- Populated dynamically -->
        </select>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- View Switcher Tabs -->
      <div class="mb-6 flex rounded-2xl bg-panel p-1 border border-white/5">
        <button id="viewRoommatesBtn" type="button" class="flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition bg-neon/15 text-neon">
          Roommates
        </button>
        <button id="viewDaysBtn" type="button" class="flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white">
          Days
        </button>
        <button id="viewLogBtn" type="button" class="flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white">
          Log Meals
        </button>
      </div>

      <!-- Current Week Total Banner -->
      <div class="mb-6 rounded-2xl border border-neon/20 bg-neon/5 px-4 py-3.5 text-xs font-semibold text-white/90 flex justify-between items-center shadow-[0_0_12px_rgba(0,242,254,0.02)]">
        <span class="uppercase tracking-wider text-white/40 font-bold">Week Total Mess Bill</span>
        <span id="weekTotal" class="text-neon font-extrabold text-sm">₹0</span>
      </div>

      <!-- Sync Status Header -->
      <div class="mb-4 flex items-center justify-between">
        <h2 id="viewTitle" class="text-xs uppercase tracking-[0.3em] text-white/35 font-bold">Roommates Directory</h2>
        <span id="syncIndicator" class="text-[9px] uppercase tracking-[0.2em] text-white/45">Synced</span>
      </div>

      <!-- Roommates View -->
      <div id="roommatesView" class="flex flex-col gap-4">
        <div id="roommatesList" class="flex flex-col gap-4">
          <!-- Roommate cards will be rendered here dynamically -->
        </div>
      </div>

      <!-- Days View -->
      <div id="daysView" class="hidden">
        <div id="daysList" class="flex flex-col gap-4">
          <!-- Day cards will be rendered here dynamically -->
        </div>
      </div>

      <!-- Log Meals View -->
      <div id="logView" class="hidden flex flex-col gap-6">
        
        <!-- Day Selector -->
        <div class="rounded-3xl border border-white/10 bg-panel p-5">
          <div class="mb-3 flex items-center justify-between">
            <div class="text-[10px] uppercase tracking-[0.3em] text-white/35 font-bold">Day Selector</div>
            <span id="selectedDayLabel" class="text-xs font-bold text-neon uppercase">Mon</span>
          </div>
          <div id="daysRow" class="grid grid-cols-4 gap-2 sm:grid-cols-7">
            <!-- Day pills populated dynamically -->
          </div>
        </div>

        <!-- Roommates Grid -->
        <div class="rounded-3xl border border-white/10 bg-panel p-5">
          <div class="mb-3 flex items-center justify-between">
            <div class="text-[10px] uppercase tracking-[0.3em] text-white/35 font-bold">Select Friends</div>
            <span id="friendCount" class="text-xs text-white/50">0 selected</span>
          </div>
          <div id="friendsGrid" class="grid grid-cols-2 gap-3 sm:grid-cols-5">
            <!-- Friend cards populated dynamically -->
          </div>
        </div>

        <!-- Meal Controls -->
        <div class="rounded-3xl border border-white/10 bg-panel p-5 flex flex-col gap-4">
          <div class="flex items-center justify-between border-b border-white/5 pb-3">
            <div>
              <div class="text-[10px] uppercase tracking-[0.3em] text-white/35 font-bold">Meal Control</div>
              <div class="text-[10px] text-white/40 mt-0.5">Toggle meals or enter custom rates.</div>
            </div>
            <label class="flex cursor-pointer items-center gap-2 select-none">
              <span class="text-xs text-white/70">Full Day</span>
              <input id="fullDayToggle" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
            </label>
          </div>

          <div class="flex flex-col gap-3">
            <!-- Breakfast -->
            <label class="flex items-center gap-3 rounded-2xl border border-white/10 bg-black/40 px-4 py-3">
              <input data-meal-checkbox="breakfast" type="checkbox" class="h-4.5 w-4.5 rounded border-white/20 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
              <span class="min-w-0 flex-1 text-sm font-medium">Breakfast</span>
              <input data-meal-input="breakfast" type="number" min="0" step="1" value="50" class="w-20 rounded-xl border border-white/10 bg-black/60 px-3 py-1.5 text-right text-xs text-white outline-none focus:border-neon transition" />
            </label>

            <!-- Lunch -->
            <label class="flex items-center gap-3 rounded-2xl border border-white/10 bg-black/40 px-4 py-3">
              <input data-meal-checkbox="lunch" type="checkbox" class="h-4.5 w-4.5 rounded border-white/20 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
              <span class="min-w-0 flex-1 text-sm font-medium">Lunch</span>
              <input data-meal-input="lunch" type="number" min="0" step="1" value="60" class="w-20 rounded-xl border border-white/10 bg-black/60 px-3 py-1.5 text-right text-xs text-white outline-none focus:border-neon transition" />
            </label>

            <!-- Dinner -->
            <label class="flex items-center gap-3 rounded-2xl border border-white/10 bg-black/40 px-4 py-3">
              <input data-meal-checkbox="dinner" type="checkbox" class="h-4.5 w-4.5 rounded border-white/20 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
              <span class="min-w-0 flex-1 text-sm font-medium">Dinner</span>
              <input data-meal-input="dinner" type="number" min="0" step="1" value="60" class="w-20 rounded-xl border border-white/10 bg-black/60 px-3 py-1.5 text-right text-xs text-white outline-none focus:border-neon transition" />
            </label>
          </div>

          <div class="mt-2 flex flex-col gap-2">
            <button id="saveLogBtn" type="button" class="w-full rounded-2xl border border-neon bg-neon/15 px-5 py-4 text-sm font-bold text-neon shadow-[0_0_12px_rgba(0,242,254,0.02)] hover:bg-neon/25 transition duration-200">
              Save Log
            </button>
            <div id="saveStatus" class="text-center text-[10px] uppercase tracking-wider text-white/45 min-h-[14px]"></div>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 text-center text-[10px] uppercase tracking-[0.3em] text-white/20 border-t border-white/5 pt-6">
      Roommate Mess Manager &bull; Powered by Vercel KV
    </footer>
  </div>

  <script>
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const friends = ['Sangeeth', 'Devan', 'Sreesanth', 'Ashwin', 'Reno'];
    const mealDefinitions = [
      { key: 'breakfast', label: 'Breakfast', defaultPrice: 50 },
      { key: 'lunch', label: 'Lunch', defaultPrice: 60 },
      { key: 'dinner', label: 'Dinner', defaultPrice: 60 }
    ];

    const API_LOAD_URL = '/api/sync';
    const API_SAVE_URL = '/api/sync';

    let activeWeekStart = null;
    let cloudLogs = [];
    const expandedRoommates = new Set(); // Tracks currently expanded cards
    const expandedDays = new Set(); // Tracks currently expanded day cards

    // Log view elements & state
    const logView = document.getElementById('logView');
    const daysRow = document.getElementById('daysRow');
    const friendsGrid = document.getElementById('friendsGrid');
    const selectedDayLabel = document.getElementById('selectedDayLabel');
    const friendCount = document.getElementById('friendCount');
    const fullDayToggle = document.getElementById('fullDayToggle');
    const saveLogBtn = document.getElementById('saveLogBtn');
    const saveStatus = document.getElementById('saveStatus');
    const weekTotal = document.getElementById('weekTotal');

    const mealControls = mealDefinitions.reduce((controls, meal) => {
      controls[meal.key] = {
        checkbox: document.querySelector(`[data-meal-checkbox="${meal.key}"]`),
        input: document.querySelector(`[data-meal-input="${meal.key}"]`)
      };
      return controls;
    }, {});

    let activeDay = 'Mon';
    const selectedFriends = new Set();
    const mealState = mealDefinitions.reduce((state, meal) => {
      state[meal.key] = {
        checked: false,
        price: meal.defaultPrice,
        manual: false
      };
      return state;
    }, {});

    // Helper functions for date operations
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${date}`;
    }

    function getWeekRangeStr(mondayStr) {
      const start = new Date(mondayStr);
      const end = new Date(mondayStr);
      end.setDate(end.getDate() + 6);
      
      const options = { month: 'short', day: 'numeric' };
      const startLabel = start.toLocaleDateString('en-US', options);
      const endLabel = end.toLocaleDateString('en-US', { 
        month: start.getMonth() === end.getMonth() ? undefined : 'short', 
        day: 'numeric' 
      });
      const yearLabel = end.getFullYear();
      
      return `${startLabel} - ${endLabel}, ${yearLabel}`;
    }

    // Normalizes records returning from the API database
    function normalizeCloudRecord(record) {
      if (!record) return null;

      const day = record.day || record.Day || '';
      let date = record.date || record.Date || '';
      if (!date && day && activeWeekStart) {
        const idx = days.indexOf(day);
        if (idx !== -1) {
          const fallbackDate = new Date(activeWeekStart);
          fallbackDate.setDate(fallbackDate.getDate() + idx);
          date = formatDate(fallbackDate);
        }
      }
      const roommateName = record.roommateName || record.Roommate || record.roommate || '';
      const roommateNames = record.roommateNames || record.friends || (roommateName ? [roommateName] : []);
      const meals = record.meals || record.Meals || {};
      const prices = record.prices || record.Prices || {};
      const totalDailyRate = Number(record.totalDailyRate ?? record.TotalDailyRate ?? record.total ?? 0);
      const savedAt = record.savedAt || record.SavedAt || new Date().toISOString();

      return {
        day,
        date,
        roommateName,
        roommateNames,
        meals,
        prices,
        totalDailyRate,
        savedAt
      };
    }

    function normalizeCloudRecords(records) {
      return (records || []).map(normalizeCloudRecord).filter(Boolean);
    }

    function formatCurrency(value) {
      return `₹${Number(value || 0).toFixed(0)}`;
    }

    // Fetch logs from the API database
    async function fetchCloudLogs() {
      const syncIndicator = document.getElementById('syncIndicator');
      syncIndicator.textContent = 'Syncing...';
      syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-neon animate-pulse';

      try {
        const response = await fetch(API_LOAD_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error(`GET ${response.status}`);

        const data = await response.json();
        cloudLogs = normalizeCloudRecords(data);
        
        syncIndicator.textContent = 'Synced';
        syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-white/45';
        
        // Re-generate dropdown menu options to capture new weeks
        buildWeekSelectorOptions();
        renderRoommatesList();
        renderDaysList();
        updateWeekTotal();
      } catch (error) {
        console.error('Failed to load cloud logs:', error);
        syncIndicator.textContent = 'Sync Failed';
        syncIndicator.className = 'text-[9px] uppercase tracking-[0.2em] text-red-400';
      }
    }

    // Dynamic dropdown weeks list generator
    function buildWeekSelectorOptions() {
      const currentMonday = getMonday(new Date());
      const currentMondayStr = formatDate(currentMonday);
      
      const weeksSet = new Set();
      weeksSet.add(currentMondayStr);
      
      // Seed with last 8 weeks
      for (let i = 1; i <= 8; i++) {
        const d = new Date(currentMonday);
        d.setDate(d.getDate() - (i * 7));
        weeksSet.add(formatDate(d));
      }
      
      // Extract any historical weeks from saved logs
      cloudLogs.forEach(log => {
        if (log.date) {
          const logMonday = getMonday(log.date);
          weeksSet.add(formatDate(logMonday));
        }
      });
      
      const sortedWeeks = Array.from(weeksSet).sort().reverse();
      const select = document.getElementById('weekSelector');
      const previousValue = select.value || currentMondayStr;
      
      select.innerHTML = sortedWeeks.map(mondayStr => {
        const label = getWeekRangeStr(mondayStr);
        const suffix = (mondayStr === currentMondayStr) ? ' (Current Week)' : '';
        return `<option value="${mondayStr}">${label}${suffix}</option>`;
      }).join('');
      
      select.value = previousValue;
      activeWeekStart = new Date(select.value + 'T00:00:00');
    }

    function renderDays() {
      daysRow.innerHTML = '';
      days.forEach(day => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = day;
        
        const isActive = (day === activeDay);
        button.className = `rounded-2xl border px-3 py-2.5 text-xs font-semibold uppercase tracking-wider transition ${
          isActive 
            ? 'border-neon bg-neon/15 text-neon shadow-[0_0_8px_rgba(0,242,254,0.04)]' 
            : 'border-white/10 bg-black/40 text-white/70 hover:border-white/20'
        }`;
        
        button.addEventListener('click', () => {
          activeDay = day;
          selectedDayLabel.textContent = day;
          renderDays();
        });
        
        daysRow.appendChild(button);
      });
    }

    function renderFriends() {
      friendsGrid.innerHTML = '';
      friends.forEach(friend => {
        const card = document.createElement('button');
        card.type = 'button';
        
        const isSelected = selectedFriends.has(friend);
        card.className = `friend-card flex flex-col justify-between rounded-2xl border p-3.5 text-left transition ${
          isSelected 
            ? 'border-neon bg-neon/15 text-neon shadow-[0_0_8px_rgba(0,242,254,0.04)]' 
            : 'border-white/10 bg-black/40 text-white/70 hover:border-white/20'
        }`;
        
        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold">${friend}</span>
            <span class="text-[9px] uppercase tracking-wider text-neon">${isSelected ? '✓' : ''}</span>
          </div>
        `;
        
        card.addEventListener('click', () => {
          if (selectedFriends.has(friend)) {
            selectedFriends.delete(friend);
          } else {
            selectedFriends.add(friend);
          }
          renderFriends();
          updateFriendCount();
        });
        
        friendsGrid.appendChild(card);
      });
    }

    function updateFriendCount() {
      friendCount.textContent = `${selectedFriends.size} selected`;
    }

    // Main layout rendering: roommate directory and details logs
    function renderRoommatesList() {
      const roommatesList = document.getElementById('roommatesList');
      roommatesList.innerHTML = '';

      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);

      // Filter all logs for the currently selected week date range
      const activeWeekLogs = cloudLogs.filter(log => log.date >= startStr && log.date <= endStr);

      friends.forEach(friend => {
        // Calculate roommate totals and counters for the selected week
        const roommateLogs = activeWeekLogs.filter(log => log.roommateNames.includes(friend) || log.roommateName === friend);
        
        let totalCost = 0;
        let breakfastCount = 0;
        let lunchCount = 0;
        let dinnerCount = 0;

        roommateLogs.forEach(log => {
          const meals = log.meals || {};
          if (meals.breakfast && meals.breakfast.checked) {
            totalCost += Number(meals.breakfast.price || 0);
            breakfastCount++;
          }
          if (meals.lunch && meals.lunch.checked) {
            totalCost += Number(meals.lunch.price || 0);
            lunchCount++;
          }
          if (meals.dinner && meals.dinner.checked) {
            totalCost += Number(meals.dinner.price || 0);
            dinnerCount++;
          }
        });

        const expanded = expandedRoommates.has(friend);

        // Build roommate card element
        const card = document.createElement('div');
        card.className = `border rounded-3xl bg-panel p-6 transition duration-200 ${
          expanded ? 'border-neon/40 shadow-[0_0_16px_rgba(0,242,254,0.06)]' : 'border-white/10 hover:border-white/20'
        }`;

        // Header (Toggles expanded state)
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between cursor-pointer select-none';
        header.innerHTML = `
          <div>
            <h3 class="text-lg font-bold text-white">${friend}</h3>
            <p class="text-[9px] uppercase tracking-wider text-white/40 mt-0.5">Roommate Summary</p>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-xl font-extrabold text-neon">${formatCurrency(totalCost)}</span>
            <span class="text-white/40 text-xs transition-transform duration-200 transform ${expanded ? 'rotate-180' : ''}">▼</span>
          </div>
        `;
        header.addEventListener('click', () => {
          if (expandedRoommates.has(friend)) {
            expandedRoommates.delete(friend);
          } else {
            expandedRoommates.add(friend);
          }
          renderRoommatesList();
        });
        card.appendChild(header);

        // Expanded Body (Shows logs grids and counters)
        if (expanded) {
          const body = document.createElement('div');
          body.className = 'mt-6 border-t border-white/5 pt-6';
          
          // Counters UI
          let countersHtml = `
            <div class="grid grid-cols-3 gap-2.5 mb-6 text-center">
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Breakfasts</div>
                <div class="text-base font-bold text-neon mt-0.5">${breakfastCount}</div>
              </div>
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Lunches</div>
                <div class="text-base font-bold text-neon mt-0.5">${lunchCount}</div>
              </div>
              <div class="bg-black/35 rounded-2xl py-3 border border-white/5">
                <div class="text-[9px] uppercase tracking-wider text-white/40">Dinners</div>
                <div class="text-base font-bold text-neon mt-0.5">${dinnerCount}</div>
              </div>
            </div>
          `;

          // Weekly logs list (Monday to Sunday checkable checkboxes)
          let daysHtml = days.map((dayName, idx) => {
            const d = new Date(activeWeekStart);
            d.setDate(d.getDate() + idx);
            const dateStr = formatDate(d);
            const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            // Find if there is an existing log for this roommate on this date
            const existingDayLog = roommateLogs.find(log => log.date === dateStr);
            
            const bChecked = existingDayLog?.meals?.breakfast?.checked || false;
            const bPrice = existingDayLog?.meals?.breakfast?.price ?? 40;
            
            const lChecked = existingDayLog?.meals?.lunch?.checked || false;
            const lPrice = existingDayLog?.meals?.lunch?.price ?? 60;
            
            const dChecked = existingDayLog?.meals?.dinner?.checked || false;
            const dPrice = existingDayLog?.meals?.dinner?.price ?? 40;

            return `
              <div class="flex flex-col gap-2 p-3 bg-black/25 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-1">
                  <span class="font-bold text-xs text-white/90">${dayName}</span>
                  <span class="text-[9px] uppercase tracking-wider text-white/40">${dateLabel}</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  
                  <!-- Breakfast -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-breakfast" ${bChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Breakfast</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-breakfast" value="${bPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                  <!-- Lunch -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-lunch" ${lChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Lunch</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-lunch" value="${lPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                  <!-- Dinner -->
                  <div class="flex flex-col gap-1.5">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                      <input type="checkbox" id="chk-${friend}-${dateStr}-dinner" ${dChecked ? 'checked' : ''} class="h-3.5 w-3.5 rounded border-white/10 bg-black text-neon focus:ring-neon" style="accent-color:#00f2fe" />
                      <span class="text-[10px] text-white/70">Dinner</span>
                    </label>
                    <input type="number" id="val-${friend}-${dateStr}-dinner" value="${dPrice}" min="0" step="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-1 text-[10px] text-right text-white focus:border-neon outline-none" />
                  </div>
                  
                </div>
              </div>
            `;
          }).join('');

          body.innerHTML = `
            ${countersHtml}
            <div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-2">Logs Sheet</div>
            <div class="flex flex-col gap-3">
              ${daysHtml}
            </div>
            
            <div class="mt-6 flex flex-col gap-2">
              <button id="btn-save-${friend}" type="button" onclick="saveRoommateWeek('${friend}')" class="w-full rounded-2xl border border-neon bg-neon/15 px-4 py-3 text-xs font-bold text-neon shadow-[0_0_12px_rgba(0,242,254,0.02)] hover:bg-neon/25 transition duration-200">
                Save Logs for ${friend}
              </button>
              <div id="status-${friend}" class="text-[9px] uppercase tracking-wider text-center text-white/40 min-h-[14px] mt-1"></div>
            </div>
          `;
          card.appendChild(body);
        }

        roommatesList.appendChild(card);
      });
    }

    // Day-wise layout rendering: 7-day schedule with cost breakdown and 'Who Ate When' expansion details
    function renderDaysList() {
      const daysList = document.getElementById('daysList');
      daysList.innerHTML = '';

      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);

      // Filter all logs for the currently selected week date range
      const activeWeekLogs = cloudLogs.filter(log => log.date >= startStr && log.date <= endStr);

      days.forEach((dayName, idx) => {
        const d = new Date(activeWeekStart);
        d.setDate(d.getDate() + idx);
        const dateStr = formatDate(d);
        const fullDateLabel = `${dayName} - ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

        // Filter logs specifically for this date
        const dayLogs = activeWeekLogs.filter(log => log.date === dateStr);

        let breakfastCost = 0;
        let lunchCost = 0;
        let dinnerCost = 0;
        
        const breakfastRoommates = [];
        const lunchRoommates = [];
        const dinnerRoommates = [];

        dayLogs.forEach(log => {
          const meals = log.meals || {};
          const roommateName = log.roommateName || log.roommateNames?.[0] || '';
          
          if (roommateName) {
            if (meals.breakfast && meals.breakfast.checked) {
              breakfastCost += Number(meals.breakfast.price || 0);
              breakfastRoommates.push(roommateName);
            }
            if (meals.lunch && meals.lunch.checked) {
              lunchCost += Number(meals.lunch.price || 0);
              lunchRoommates.push(roommateName);
            }
            if (meals.dinner && meals.dinner.checked) {
              dinnerCost += Number(meals.dinner.price || 0);
              dinnerRoommates.push(roommateName);
            }
          }
        });

        const dayTotal = breakfastCost + lunchCost + dinnerCost;
        const expanded = expandedDays.has(dateStr);

        const card = document.createElement('div');
        card.className = `border rounded-3xl bg-panel p-6 transition duration-200 cursor-pointer select-none ${
          expanded ? 'border-neon/40 shadow-[0_0_16px_rgba(0,242,254,0.06)]' : 'border-white/10 hover:border-white/20'
        }`;

        card.innerHTML = `
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h3 class="text-base font-bold text-white">${fullDateLabel}</h3>
              <div class="mt-1 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-white/50">
                <span>B: <span class="text-white/80">${formatCurrency(breakfastCost)}</span></span>
                <span class="text-white/20">|</span>
                <span>L: <span class="text-white/80">${formatCurrency(lunchCost)}</span></span>
                <span class="text-white/20">|</span>
                <span>D: <span class="text-white/80">${formatCurrency(dinnerCost)}</span></span>
              </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-4 border-t border-white/5 pt-2 sm:border-0 sm:pt-0">
              <span class="text-lg font-extrabold text-neon">${formatCurrency(dayTotal)}</span>
              <span class="text-white/40 text-xs transition-transform duration-200 transform ${expanded ? 'rotate-180' : ''}">▼</span>
            </div>
          </div>
          
          ${expanded ? `
            <div class="mt-5 border-t border-white/5 pt-5 text-xs space-y-3.5">
              <div>
                <div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-1">Breakfast</div>
                <div class="text-white/85 pl-2 border-l border-neon/30">
                  - ${breakfastRoommates.length > 0 ? breakfastRoommates.join(', ') : 'None'}
                </div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-1">Lunch</div>
                <div class="text-white/85 pl-2 border-l border-neon/30">
                  - ${lunchRoommates.length > 0 ? lunchRoommates.join(', ') : 'None'}
                </div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-1">Dinner</div>
                <div class="text-white/85 pl-2 border-l border-neon/30">
                  - ${dinnerRoommates.length > 0 ? dinnerRoommates.join(', ') : 'None'}
                </div>
              </div>
            </div>
          ` : ''}
        `;

        card.addEventListener('click', () => {
          if (expandedDays.has(dateStr)) {
            expandedDays.delete(dateStr);
          } else {
            expandedDays.add(dateStr);
          }
          renderDaysList();
        });

        daysList.appendChild(card);
      });
    }

    function updateWeekTotal() {
      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);
      
      const activeWeekLogs = cloudLogs.filter(log => log.date >= startStr && log.date <= endStr);
      const total = activeWeekLogs.reduce((sum, log) => {
        let logCost = 0;
        const count = Array.isArray(log.roommateNames) ? log.roommateNames.length : 1;
        if (log.meals) {
          ['breakfast', 'lunch', 'dinner'].forEach(k => {
            if (log.meals[k] && log.meals[k].checked) {
              logCost += Number(log.meals[k].price || 0);
            }
          });
        }
        return sum + (logCost * count);
      }, 0);

      weekTotal.textContent = formatCurrency(total);
    }

    function syncMealControls() {
      mealDefinitions.forEach(meal => {
        const state = mealState[meal.key];
        const controls = mealControls[meal.key];
        if (controls) {
          controls.checkbox.checked = state.checked;
          controls.input.value = state.price;
          controls.input.classList.toggle('text-neon', state.manual);
          controls.input.classList.toggle('border-neon', state.manual);
        }
      });

      fullDayToggle.checked = mealDefinitions.every(meal => mealState[meal.key].checked);
    }

    function updateDefaultPricesBasedOnSelection() {
      const selectedKeys = mealDefinitions.filter(m => mealState[m.key].checked).map(m => m.key);
      const hasManual = mealDefinitions.some(m => mealState[m.key].manual);
      
      if (!hasManual) {
        if (selectedKeys.length === 3) {
          mealState.breakfast.price = 40;
          mealState.lunch.price = 60;
          mealState.dinner.price = 40;
        } else if (selectedKeys.includes('breakfast') && selectedKeys.includes('lunch') && selectedKeys.length === 2) {
          mealState.breakfast.price = 40;
          mealState.lunch.price = 60;
          mealState.dinner.price = 60;
        } else {
          mealState.breakfast.price = 50;
          mealState.lunch.price = 60;
          mealState.dinner.price = 60;
        }
      }
    }

    function handleMealToggle(mealKey, isChecked) {
      mealState[mealKey].checked = isChecked;
      updateDefaultPricesBasedOnSelection();
      syncMealControls();
    }

    function handleMealPriceChange(mealKey, value) {
      const numericValue = Number(value);
      if (Number.isNaN(numericValue)) return;
      
      mealState[mealKey].price = numericValue;
      mealState[mealKey].manual = true;
      syncMealControls();
    }

    function setFullDayState(isChecked) {
      mealDefinitions.forEach(meal => {
        mealState[meal.key].checked = isChecked;
      });
      updateDefaultPricesBasedOnSelection();
      syncMealControls();
    }

    // Handles saving roommate's weekly logs compiled into JSON payload
    async function saveRoommateWeek(friend) {
      const statusLabel = document.getElementById(`status-${friend}`);
      const saveBtn = document.getElementById(`btn-save-${friend}`);
      
      statusLabel.textContent = 'Saving...';
      statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-neon animate-pulse mt-1';
      saveBtn.disabled = true;

      const startStr = formatDate(activeWeekStart);
      const end = new Date(activeWeekStart);
      end.setDate(end.getDate() + 6);
      const endStr = formatDate(end);

      const newLogsForFriend = [];

      // Compile checkboxes and pricing inputs for all 7 days
      for (let idx = 0; idx < 7; idx++) {
        const d = new Date(activeWeekStart);
        d.setDate(d.getDate() + idx);
        const dateStr = formatDate(d);
        const dayName = days[idx];

        const chkBreakfast = document.getElementById(`chk-${friend}-${dateStr}-breakfast`).checked;
        const valBreakfast = Number(document.getElementById(`val-${friend}-${dateStr}-breakfast`).value || 40);

        const chkLunch = document.getElementById(`chk-${friend}-${dateStr}-lunch`).checked;
        const valLunch = Number(document.getElementById(`val-${friend}-${dateStr}-lunch`).value || 60);

        const chkDinner = document.getElementById(`chk-${friend}-${dateStr}-dinner`).checked;
        const valDinner = Number(document.getElementById(`val-${friend}-${dateStr}-dinner`).value || 40);

        if (chkBreakfast || chkLunch || chkDinner) {
          let dailyRate = 0;
          if (chkBreakfast) dailyRate += valBreakfast;
          if (chkLunch) dailyRate += valLunch;
          if (chkDinner) dailyRate += valDinner;

          newLogsForFriend.push({
            day: dayName,
            date: dateStr,
            roommateNames: [friend],
            roommateName: friend,
            meals: {
              breakfast: { checked: chkBreakfast, price: valBreakfast },
              lunch: { checked: chkLunch, price: valLunch },
              dinner: { checked: chkDinner, price: valDinner }
            },
            prices: {
              breakfast: valBreakfast,
              lunch: valLunch,
              dinner: valDinner
            },
            totalDailyRate: dailyRate,
            savedAt: new Date().toISOString()
          });
        }
      }

      // Filter out target roommate's logs inside selected week to avoid duplicates
      const otherLogs = cloudLogs.filter(log => {
        const isTargetFriend = log.roommateNames.includes(friend) || log.roommateName === friend;
        const isTargetWeek = log.date >= startStr && log.date <= endStr;
        return !(isTargetFriend && isTargetWeek);
      });

      const updatedLogs = [...otherLogs, ...newLogsForFriend];

      try {
        const response = await fetch(API_SAVE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updatedLogs)
        });

        if (!response.ok) throw new Error(`POST ${response.status}`);

        // Re-fetch database state to trigger UI updates
        await fetchCloudLogs();
        
        statusLabel.textContent = 'Saved Successfully!';
        statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-neon mt-1';
        setTimeout(() => {
          statusLabel.textContent = '';
        }, 3000);
      } catch (error) {
        console.error('Failed to save roommate week logs:', error);
        statusLabel.textContent = 'Save Failed';
        statusLabel.className = 'text-[9px] uppercase tracking-wider text-center text-red-400 mt-1';
      } finally {
        saveBtn.disabled = false;
      }
    }

    function getDateOfActiveDay(dayName) {
      const dayIndex = days.indexOf(dayName);
      const date = new Date(activeWeekStart);
      date.setDate(date.getDate() + dayIndex);
      return formatDate(date);
    }

    function saveCurrentLog() {
      const selectedRoommates = Array.from(selectedFriends);
      if (selectedRoommates.length === 0) {
        saveStatus.textContent = 'Please select at least one roommate.';
        return;
      }

      const activeDateStr = getDateOfActiveDay(activeDay);
      const mealSnapshot = mealDefinitions.reduce((snapshot, meal) => {
        snapshot[meal.key] = { ...mealState[meal.key] };
        return snapshot;
      }, {});

      const dailyPriceSum = mealDefinitions.reduce((sum, meal) => {
        if (mealState[meal.key].checked) {
          return sum + Number(mealState[meal.key].price);
        }
        return sum;
      }, 0);

      const newLog = {
        day: activeDay,
        date: activeDateStr,
        roommateNames: selectedRoommates,
        roommateName: selectedRoommates[0] || '',
        meals: mealSnapshot,
        prices: mealDefinitions.reduce((snapshot, meal) => {
          snapshot[meal.key] = Number(mealState[meal.key].price || 0);
          return snapshot;
        }, {}),
        totalDailyRate: dailyPriceSum,
        savedAt: new Date().toISOString()
      };

      saveStatus.textContent = 'Saving...';
      saveStatus.className = 'text-center text-[10px] uppercase tracking-wider text-neon animate-pulse';

      // Clean duplicate logs for these roommates on this specific day date
      const cleanedLogs = [];
      const newRoommatesSet = new Set(selectedRoommates);

      cloudLogs.forEach(log => {
        if (log.date === activeDateStr) {
          const currRoommates = Array.isArray(log.roommateNames)
            ? log.roommateNames
            : (log.roommateName ? [log.roommateName] : []);
          
          const updatedRoommates = currRoommates.filter(r => !newRoommatesSet.has(r));
          if (updatedRoommates.length > 0) {
            const updatedLog = { ...log };
            updatedLog.roommateNames = updatedRoommates;
            updatedLog.roommateName = updatedRoommates[0];
            
            let logCost = 0;
            if (updatedLog.meals) {
              ['breakfast', 'lunch', 'dinner'].forEach(k => {
                if (updatedLog.meals[k] && updatedLog.meals[k].checked) {
                  logCost += Number(updatedLog.meals[k].price || 0);
                }
              });
            }
            updatedLog.totalDailyRate = logCost;
            cleanedLogs.push(updatedLog);
          }
        } else {
          cleanedLogs.push(log);
        }
      });

      cleanedLogs.push(newLog);

      fetch(API_SAVE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(cleanedLogs)
      })
      .then(response => {
        if (!response.ok) throw new Error(`POST ${response.status}`);
        return response.json();
      })
      .then(() => fetchCloudLogs())
      .then(() => {
        saveStatus.textContent = `Saved ${activeDay} log for ${selectedRoommates.length} roommate(s).`;
        saveStatus.className = 'text-center text-[10px] uppercase tracking-wider text-neon';
        setTimeout(() => {
          saveStatus.textContent = '';
        }, 3000);
      })
      .catch(error => {
        console.error('Save log failed', error);
        saveStatus.textContent = 'Save failed. Check connection.';
        saveStatus.className = 'text-center text-[10px] uppercase tracking-wider text-red-400';
      });
    }

    // Tab View Toggle elements
    const btnRoommates = document.getElementById('viewRoommatesBtn');
    const btnDays = document.getElementById('viewDaysBtn');
    const btnLog = document.getElementById('viewLogBtn');
    
    const roommatesView = document.getElementById('roommatesView');
    const daysView = document.getElementById('daysView');
    const viewTitle = document.getElementById('viewTitle');

    btnRoommates.addEventListener('click', () => {
      btnRoommates.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition bg-neon/15 text-neon';
      btnDays.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      btnLog.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      
      roommatesView.classList.remove('hidden');
      daysView.classList.add('hidden');
      logView.classList.add('hidden');
      viewTitle.textContent = 'Roommates Directory';
      renderRoommatesList();
    });

    btnDays.addEventListener('click', () => {
      btnDays.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition bg-neon/15 text-neon';
      btnRoommates.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      btnLog.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      
      roommatesView.classList.add('hidden');
      daysView.classList.remove('hidden');
      logView.classList.add('hidden');
      viewTitle.textContent = 'Day-wise breakdown';
      renderDaysList();
    });

    btnLog.addEventListener('click', () => {
      btnLog.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition bg-neon/15 text-neon';
      btnRoommates.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      btnDays.className = 'flex-1 rounded-xl py-2.5 text-center text-xs font-semibold tracking-wider uppercase transition text-white/50 hover:text-white';
      
      roommatesView.classList.add('hidden');
      daysView.classList.add('hidden');
      logView.classList.remove('hidden');
      viewTitle.textContent = 'Meal Logging Panel';
      
      renderDays();
      renderFriends();
      updateFriendCount();
      syncMealControls();
    });

    // Set dropdown change handler
    document.getElementById('weekSelector').addEventListener('change', (e) => {
      activeWeekStart = new Date(e.target.value + 'T00:00:00');
      renderRoommatesList();
      renderDaysList();
      updateWeekTotal();
      if (!logView.classList.contains('hidden')) {
        renderDays();
        renderFriends();
      }
    });

    // Initialize layout on window load
    window.addEventListener('load', () => {
      buildWeekSelectorOptions();
      fetchCloudLogs();

      fullDayToggle.addEventListener('change', () => {
        setFullDayState(fullDayToggle.checked);
      });

      mealDefinitions.forEach(meal => {
        const controls = mealControls[meal.key];
        if (controls) {
          controls.checkbox.addEventListener('change', (e) => {
            handleMealToggle(meal.key, e.target.checked);
          });
          controls.input.addEventListener('input', (e) => {
            handleMealPriceChange(meal.key, e.target.value);
          });
        }
      });

      saveLogBtn.addEventListener('click', saveCurrentLog);
    });
  </script>
</body>
</html>
